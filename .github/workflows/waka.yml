name: WakaTime Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOWW_TOTAL: 'true'
          SHOW_TIME: 'true'
          TIME_RANGE: 'all_time'
          LANGUAGE_COUNT: '5'
          SHOW_MASKED_TIME: 'true'
          BLOCKS: "⣿ ⣷ ⣯ ⣟ ⡿ ⢿ ⣻ ⣽"